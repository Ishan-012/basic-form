<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="side">

            <div class="logo">
                <img src="odinLogo.png"> ODIN
            </div>
            <div class="credit">Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com/">Unsplash</a></div>
        </div>

        <div class="main">
            <div>
                <p class="line1">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
                <p class="line2">You <em>know</em> you want to.</p>
            </div>
            <form>
                <div class="form-main">
                    <div class="form-header">Let's do this!</div>
                    <div class="user-input">
                        <div>
                            <label for="firstName">FIRST NAME</label>
                            
                            <input type="text" id="firstName" name="firstName" required>
                        </div>
                        <div>
                            <label for="lastName">LAST NAME</label>
                            
                            <input type="text" name="lastName" id="lastName" required>
                        </div>
                        <div>
                            <label for="eMail">EMAIL</label>
                            
                            <input type="email" name="eMail" id="eMail" required>
                        </div>
                        <div>
                            <label for="phone">PHONE NUMBER</label>
                            
                            <input type="tel" name="phone" id="phone" required>
                        </div>
                        <div>
                            <label for="pass">PASSWORD</label>
                            
                            <input type="password" name="pass" id="pass" required>
                        </div>
                        <div>
                            <label for="confirmPass">CONFIRM PASSWORD</label>
                            
                            <input type="password" name="pass" required>
                        </div>
                    </div>
                    
                </div>
                <button type="submit">Create Account</button>
                <div class="log">Already have an account? <a href="">Log in</a></div>
            </form>
        </div>
    </div>

</body>
</html>
